name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Cancel in-progress runs for the same PR/branch to save compute and report fast feedback.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.0"

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `model-cycle` e `model-edge-cases` invocam `api/model/project.py` num
      # subprocesso e procuram o interpretador em `.venv-model/bin/python3.14`,
      # com fallback para o `python3.14` do PATH. Sem isto, o fallback acha um
      # Python sem as dependências e o teste falha com ModuleNotFoundError.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # 🔴 `requirements-DEV.txt`, não `requirements.txt`. O de produção é
      # deliberadamente minimalista — só o que entra no bundle da função na
      # Vercel (numpy, pydantic, psycopg) — e **não tem pytest**. O de dev faz
      # `-r requirements.txt` e acrescenta o pytest.
      #
      # Até 18/09 este passo instalava o de produção, e o passo do pytest morria
      # com `No module named pytest`. Não apareceu antes porque a conferência do
      # segredo do banco abortava o job antes de chegar lá, e porque o `.venv-model`
      # da máquina local tem pytest instalado à mão — "provado localmente com o
      # comando exato do CI" era verdade na máquina e falso no runner.
      - name: Dependências do modelo em .venv-model
        run: |
          python -m venv .venv-model
          .venv-model/bin/python -m pip install --quiet --upgrade pip
          .venv-model/bin/python -m pip install --quiet -r api/model/requirements-dev.txt
          .venv-model/bin/python3.14 -c "import numpy, pydantic, psycopg, pytest; print('deps do modelo ok')"

      # Os 560 testes do modelo estatístico não tinham portão nenhum até 18/09:
      # o job montava o `.venv-model` só para que `model-cycle` e
      # `model-edge-cases` (vitest) conseguissem invocar o modelo em subprocesso,
      # e nunca executava a suíte Python. Uma regressão em `api/model/` — o
      # coração aritmético do produto — passava verde. Item 4 da sprint S08.
      #
      # ⚠️ NÃO use `pnpm test:py`: o script é literalmente `python -m pytest`
      # (package.json), pega o `python` do PATH e morre com
      # `ModuleNotFoundError: pydantic` antes do primeiro teste.
      #
      # 🔴 Este passo NÃO recebe `DATABASE_URL`, e a ausência é deliberada.
      # `pyproject.toml` fixa `testpaths = ["tests/unit/model"]`, que não toca o
      # banco — medido em 18/09: `env -u DATABASE_URL … -m pytest` → 560 passed.
      # Passar a credencial aqui só criaria a chance de algum teste futuro
      # escrever num banco real por acidente, que é exatamente o incidente de
      # 17/09 (1.877 linhas de harness em produção). Ver
      # tests/integration/_guarda-banco.ts e docs/operations/runbook.md.
      - name: Testes do modelo (pytest)
        run: .venv-model/bin/python3.14 -m pytest

      # ⚠️ ORDEM DELIBERADA — o pytest vem ANTES da conferência do segredo.
      # Até 18/09 a conferência abria o bloco, e como ela sai com 1 quando o
      # segredo falta, os passos seguintes eram PULADOS: os 576 testes do
      # modelo nunca chegaram a rodar no GitHub, barrados por uma credencial
      # que eles deliberadamente não usam. A conferência continua reprovando o
      # job — só deixou de levar junto quem não depende dela.
      # Os testes de integração e os de cobertura geográfica conferem o banco
      # CHEIO (>= 6.000 pares município×zona, >= 5.500 municípios, 155-157 mi de
      # eleitores, >= 20.000 linhas históricas de 2018 e 2022). Um Postgres vazio
      # com as migrations aplicadas reprovaria todos — por isso o CI aponta para
      # um BRANCH do banco no Neon (cópia copy-on-write, já populada), nunca para
      # produção. Ver docs/operations/runbook.md.
      - name: Conferir o segredo do banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_CI não está cadastrado nos segredos do repositório." >&2
            echo "Sem ele, 10 arquivos de teste falham com '[db] DATABASE_URL ausente' e a" >&2
            echo "causa real fica escondida atrás de falhas genéricas. Cadastre o segredo" >&2
            echo "apontando para um BRANCH do banco no Neon (não para produção)." >&2
            exit 1
          fi

      - name: Unit tests
        run: pnpm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}
