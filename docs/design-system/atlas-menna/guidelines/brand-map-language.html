<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;margin:0}</style></head><body><div style="display:grid;grid-template-columns:repeat(11,1fr);gap:2px;height:40px"><span style="background:var(--party-pt-5)"></span><span style="background:var(--party-pt-4)"></span><span style="background:var(--party-pt-3)"></span><span style="background:var(--party-pt-2)"></span><span style="background:var(--party-pt-1)"></span><span style="background:var(--party-tie)"></span><span style="background:var(--party-pl-1)"></span><span style="background:var(--party-pl-2)"></span><span style="background:var(--party-pl-3)"></span><span style="background:var(--party-pl-4)"></span><span style="background:var(--party-pl-5)"></span></div><div style="display:flex;justify-content:space-between;font:var(--type-data);color:var(--text-secondary);margin-top:6px"><span>Lula +30</span><span>0</span><span>Flávio +30</span></div><p style="margin:14px 0 0;font:var(--type-body-sm);color:var(--text-secondary)">Uncounted areas use <code style="font:var(--type-data)">--map-uncounted</code>. Hover always shows Parcial and Projeção side by side. Municipality strokes 0.45px in paper colour; selected outline in ink.</p></body></html>
