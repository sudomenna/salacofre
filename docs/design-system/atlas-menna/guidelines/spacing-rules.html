<!-- @dsCard group="Spacing" viewport="700x220" name="Rules, radii & tap targets" subtitle="Sections separated by rules, not cards. Radii 2/4/8. 44px minimum tap" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;margin:0}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px"><div><div style="border-top:3px double var(--border-strong);padding-top:8px;font:var(--type-kicker);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--accent-strong)">Double rule · section</div><div style="border-top:1px solid var(--border-strong);margin-top:14px;padding-top:8px;font:var(--type-kicker);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-secondary)">Single strong · sub-section</div><div style="border-top:1px solid var(--border-hairline);margin-top:14px;padding-top:8px;font:var(--type-kicker);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-muted)">Hairline · rows</div></div><div style="display:flex;gap:12px;align-items:flex-end"><span style="width:44px;height:44px;border:1px solid var(--border-strong);border-radius:var(--radius-xs);display:grid;place-items:center;font:var(--type-data)">2</span><span style="width:44px;height:44px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);display:grid;place-items:center;font:var(--type-data)">4</span><span style="width:44px;height:44px;border:1px solid var(--border-strong);border-radius:var(--radius-md);display:grid;place-items:center;font:var(--type-data)">8</span><span style="height:44px;padding:0 14px;border:1px solid var(--border-strong);border-radius:var(--radius-pill);display:grid;place-items:center;font:var(--type-data)">pill</span></div></div></body></html>
