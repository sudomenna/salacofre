<!-- @dsCard group="Colors" viewport="700x150" name="Accent & status" subtitle="Ochre = projection / live. Green = final. Red = warning" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;margin:0}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}.sw{display:grid;gap:5px}.sw span{height:44px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline)}.sw b{font:var(--type-data);font-weight:400;color:var(--text-secondary)}</style></head><body><div class="g"><div class="sw"><span style="background:var(--accent)"></span><b>--accent</b></div><div class="sw"><span style="background:var(--accent-strong)"></span><b>--accent-strong</b></div><div class="sw"><span style="background:var(--accent-soft)"></span><b>--accent-soft</b></div><div class="sw"><span style="background:var(--accent-ink)"></span><b>--accent-ink</b></div><div class="sw"><span style="background:var(--status-live)"></span><b>--status-live</b></div><div class="sw"><span style="background:var(--status-final)"></span><b>--status-final</b></div><div class="sw"><span style="background:var(--status-warn)"></span><b>--status-warn</b></div></div></body></html>
