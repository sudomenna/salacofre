<!-- @dsCard group="Colors" viewport="700x200" name="Poles: PT × PL" subtitle="5 margin intensities each (0–3, 3–8, 8–15, 15–30, 30+ pp) + tie" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;margin:0}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}.sw{display:grid;gap:5px}.sw span{height:44px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline)}.sw b{font:var(--type-data);font-weight:400;color:var(--text-secondary)}</style></head><body><div class="g"><div class="sw"><span style="background:var(--party-pt-5)"></span><b>--party-pt-5</b></div><div class="sw"><span style="background:var(--party-pt-4)"></span><b>--party-pt-4</b></div><div class="sw"><span style="background:var(--party-pt-3)"></span><b>--party-pt-3</b></div><div class="sw"><span style="background:var(--party-pt-2)"></span><b>--party-pt-2</b></div><div class="sw"><span style="background:var(--party-pt-1)"></span><b>--party-pt-1</b></div><div class="sw"><span style="background:var(--party-tie)"></span><b>tie</b></div><div class="sw"><span style="background:var(--party-pl-1)"></span><b>--party-pl-1</b></div><div class="sw"><span style="background:var(--party-pl-2)"></span><b>--party-pl-2</b></div><div class="sw"><span style="background:var(--party-pl-3)"></span><b>--party-pl-3</b></div><div class="sw"><span style="background:var(--party-pl-4)"></span><b>--party-pl-4</b></div><div class="sw"><span style="background:var(--party-pl-5)"></span><b>--party-pl-5</b></div></div></body></html>
