<!-- @dsCard group="Colors" viewport="700x150" name="Paper & ink" subtitle="Cool-grey paper scale and ink scale (light theme)" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;margin:0}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}.sw{display:grid;gap:5px}.sw span{height:44px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline)}.sw b{font:var(--type-data);font-weight:400;color:var(--text-secondary)}</style></head><body><div class="g"><div class="sw"><span style="background:var(--paper-0)"></span><b>--paper-0</b></div><div class="sw"><span style="background:var(--paper-1)"></span><b>--paper-1</b></div><div class="sw"><span style="background:var(--paper-2)"></span><b>--paper-2</b></div><div class="sw"><span style="background:var(--paper-3)"></span><b>--paper-3</b></div><div class="sw"><span style="background:var(--ink-3)"></span><b>--ink-3</b></div><div class="sw"><span style="background:var(--ink-2)"></span><b>--ink-2</b></div><div class="sw"><span style="background:var(--ink-1)"></span><b>--ink-1</b></div><div class="sw"><span style="background:var(--ink-0)"></span><b>--ink-0</b></div></div></body></html>
